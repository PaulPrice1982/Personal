<div class="dg--ned2" style="background:#F5F7F2;border-radius:6px">
<style>.dg--ned2>svg{display:block;width:100%;height:auto}</style>
<svg viewBox="0 0 900 360" role="img" aria-labelledby="dgnd2t" xmlns="http://www.w3.org/2000/svg">
<title id="dgnd2t">An independent commercial voice joins the board, and the revenue plan, the forecast and exit readiness firm up</title>
<defs>
 <linearGradient id="nd2glass" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#E4EBDD" stop-opacity=".9"/></linearGradient>
 <style>
  .nd2lbl{font:600 11px Inter,Calibri,sans-serif;fill:#6B7570;letter-spacing:.12em}
  .nd2table{fill:none;stroke:#C9D3C3;stroke-width:1.5}
  .nd2seat{fill:#E4EBDD;stroke:#9CAF88;stroke-width:1.5}
  .nd2ind{fill:#1F3D2B;stroke:#9CAF88;stroke-width:2;animation:nd2arrive 10s ease-out infinite}
  .nd2ring{fill:none;stroke:#9CAF88;stroke-width:1;opacity:.6;animation:nd2arrive 10s ease-out infinite}
  .nd2line{stroke:#9CAF88;stroke-width:2;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;animation:nd2reach 10s ease-out infinite}
  .nd2l2{animation-name:nd2reach2}.nd2l3{animation-name:nd2reach3}
  .nd2track{fill:#B03A2E;opacity:.14}
  .nd2bar{fill:#1F3D2B;transform:scaleX(.42);transform-origin:560px 0;animation:nd2firm 10s ease-out infinite}
  .nd2b2{animation-name:nd2firm2}.nd2b3{animation-name:nd2firm3}
  .nd2tag{animation:nd2pop 10s ease-out infinite}
  .nd2tag rect{fill:url(#nd2glass);stroke:#9CAF88;stroke-width:.8}
  .nd2tag text{font:600 11px Inter,Calibri,sans-serif;fill:#1F3D2B}
  .nd2tag .nd2tick{font:700 11px Inter,sans-serif;fill:#2E7D32}
  .nd2p1{animation-name:nd2pop1}.nd2p2{animation-name:nd2pop2}.nd2p3{animation-name:nd2pop3}
  .nd2legend{font:500 12px Inter,Calibri,sans-serif;fill:#2B2B2B}
  @keyframes nd2arrive{0%,6%{opacity:0;transform:translateX(26px)}16%,92%{opacity:1;transform:translateX(0)}100%{opacity:0}}
  @keyframes nd2reach{0%,18%{stroke-dashoffset:160}30%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:160}}
  @keyframes nd2reach2{0%,24%{stroke-dashoffset:160}36%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:160}}
  @keyframes nd2reach3{0%,30%{stroke-dashoffset:160}42%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:160}}
  @keyframes nd2firm{0%,28%{transform:scaleX(.42)}44%,92%{transform:scaleX(1)}100%{transform:scaleX(.42)}}
  @keyframes nd2firm2{0%,34%{transform:scaleX(.36)}50%,92%{transform:scaleX(1)}100%{transform:scaleX(.36)}}
  @keyframes nd2firm3{0%,40%{transform:scaleX(.3)}56%,92%{transform:scaleX(1)}100%{transform:scaleX(.3)}}
  @keyframes nd2pop1{0%,40%{opacity:0;transform:translateY(6px)}48%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes nd2pop2{0%,46%{opacity:0;transform:translateY(6px)}54%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes nd2pop3{0%,52%{opacity:0;transform:translateY(6px)}60%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.nd2ind,.nd2ring,.nd2tag{animation:none;opacity:1}.nd2line{animation:none;stroke-dashoffset:0}.nd2bar{animation:none;transform:scaleX(1)}}
 </style>
</defs>
<ellipse class="nd2table" cx="230" cy="170" rx="150" ry="72"/>
<circle class="nd2seat" cx="130" cy="112" r="17"/>
<circle class="nd2seat" cx="230" cy="92" r="17"/>
<circle class="nd2seat" cx="330" cy="112" r="17"/>
<circle class="nd2seat" cx="310" cy="236" r="17"/>
<circle class="nd2seat" cx="150" cy="236" r="17"/>
<circle class="nd2ind" cx="396" cy="170" r="19"/>
<circle class="nd2ring" cx="396" cy="170" r="27"/>
<text class="nd2lbl" x="396" y="222" text-anchor="middle">INDEPENDENT</text>
<line class="nd2line" x1="420" y1="156" x2="540" y2="92"/>
<line class="nd2line nd2l2" x1="422" y1="170" x2="540" y2="170"/>
<line class="nd2line nd2l3" x1="420" y1="184" x2="540" y2="248"/>
<g class="nd2tag nd2p1" transform="translate(556,62)"><rect width="140" height="30" rx="6"/><text x="12" y="19"><tspan class="nd2tick">&#10003;</tspan> Revenue plan</text></g>
<rect class="nd2track" x="560" y="100" width="280" height="12" rx="3"/>
<rect class="nd2bar" x="560" y="100" width="280" height="12" rx="3" style="transform-origin:560px 106px"/>
<g class="nd2tag nd2p2" transform="translate(556,140)"><rect width="110" height="30" rx="6"/><text x="12" y="19"><tspan class="nd2tick">&#10003;</tspan> Forecast</text></g>
<rect class="nd2track" x="560" y="178" width="280" height="12" rx="3"/>
<rect class="nd2bar nd2b2" x="560" y="178" width="280" height="12" rx="3" style="transform-origin:560px 184px"/>
<g class="nd2tag nd2p3" transform="translate(556,218)"><rect width="150" height="30" rx="6"/><text x="12" y="19"><tspan class="nd2tick">&#10003;</tspan> Exit readiness</text></g>
<rect class="nd2track" x="560" y="256" width="280" height="12" rx="3"/>
<rect class="nd2bar nd2b3" x="560" y="256" width="280" height="12" rx="3" style="transform-origin:560px 262px"/>
<g transform="translate(60,340)"><circle cx="8" cy="-4" r="8" class="nd2seat"/><text class="nd2legend" x="26" y="0">The board</text>
<circle cx="140" cy="-4" r="8" fill="#1F3D2B" stroke="#9CAF88" stroke-width="1.5"/><text class="nd2legend" x="158" y="0">The independent commercial seat</text>
<rect x="420" y="-12" width="18" height="10" fill="#B03A2E" opacity=".14"/><text class="nd2legend" x="446" y="0">Where it stood before the challenge</text></g>
</svg>
</div>
