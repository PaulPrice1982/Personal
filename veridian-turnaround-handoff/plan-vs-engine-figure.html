<figure class="fig">
<svg viewBox="0 0 900 360" role="img" aria-labelledby="figt" xmlns="http://www.w3.org/2000/svg">
<title id="figt">Plan versus engine: four gaps closed, and kept closed</title>
<defs>
 <linearGradient id="gapfill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#B03A2E" stop-opacity=".18"/><stop offset="1" stop-color="#B03A2E" stop-opacity=".04"/></linearGradient>
 <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#E4EBDD" stop-opacity=".9"/></linearGradient>
 <style>
  .ax{stroke:#C9D3C3;stroke-width:1}
  .lbl{font:600 11px Inter,Calibri,sans-serif;fill:#6B7570;letter-spacing:.12em}
  .plan{fill:none;stroke:#1F3D2B;stroke-width:3;stroke-linecap:round}
  .engine{fill:none;stroke:#9CAF88;stroke-width:3;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 10s ease-out infinite}
  .gap{fill:url(#gapfill);animation:fade 10s ease-in infinite}
  .g1{animation-name:fade1}.g2{animation-name:fade2}.g3{animation-name:fade3}.g4{animation-name:fade4}
  .tag{animation:pop 10s ease-out infinite}
  .tag rect{fill:url(#glass);stroke:#9CAF88;stroke-width:.8}
  .tag text{font:600 11px Inter,Calibri,sans-serif;fill:#1F3D2B}
  .tag .tick{font:700 11px Inter,sans-serif;fill:#2E7D32}
  .t1{animation-name:pop1}.t2{animation-name:pop2}.t3{animation-name:pop3}.t4{animation-name:pop4}
  .knot{animation:knot 10s ease-out infinite}
  .legend{font:500 12px Inter,Calibri,sans-serif;fill:#2B2B2B}
  @keyframes draw{0%{stroke-dashoffset:900}4%{stroke-dashoffset:900}34%{stroke-dashoffset:0}92%{stroke-dashoffset:0}100%{stroke-dashoffset:900}}
  @keyframes fade1{0%,12%{opacity:1}22%,90%{opacity:0}100%{opacity:1}}
  @keyframes fade2{0%,18%{opacity:1}28%,90%{opacity:0}100%{opacity:1}}
  @keyframes fade3{0%,24%{opacity:1}34%,90%{opacity:0}100%{opacity:1}}
  @keyframes fade4{0%,30%{opacity:1}40%,90%{opacity:0}100%{opacity:1}}
  @keyframes pop1{0%,15%{opacity:0;transform:translateY(6px)}21%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes pop2{0%,21%{opacity:0;transform:translateY(6px)}27%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes pop3{0%,27%{opacity:0;transform:translateY(6px)}33%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes pop4{0%,33%{opacity:0;transform:translateY(6px)}39%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes knot{0%,36%{opacity:0;transform:scale(.6);transform-origin:860px 111px}42%,90%{opacity:1;transform:scale(1);transform-origin:860px 111px}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.engine{animation:none;stroke-dashoffset:0}.gap{animation:none;opacity:0}.tag,.knot{animation:none;opacity:1}}
 </style>
</defs>
<line class="ax" x1="60" y1="300" x2="860" y2="300"/><line class="ax" x1="60" y1="40" x2="60" y2="300"/>
<text class="lbl" x="60" y="322">WEEK 0</text><text class="lbl" x="420" y="322" text-anchor="middle">WEEK 6</text><text class="lbl" x="860" y="322" text-anchor="end">WEEK 12</text>
<text class="lbl" x="48" y="46" text-anchor="end">ARR</text>
<!-- gaps (shaded between plan and engine before interventions land) -->
<path class="gap g1" d="M60,230 L260,208 L260,262 L60,266 Z"/>
<path class="gap g2" d="M260,208 L460,182 L460,250 L260,262 Z"/>
<path class="gap g3" d="M460,182 L660,150 L660,222 L460,250 Z"/>
<path class="gap g4" d="M660,150 L860,110 L860,182 L660,222 Z"/>
<!-- plan line -->
<path class="plan" d="M60,230 L260,208 L460,182 L660,150 L860,110"/>
<!-- engine line: starts well below, converges by week 12 -->
<path class="engine" d="M60,266 C180,262 220,250 300,238 S420,210 500,196 S640,160 720,140 S820,116 860,112"/>
<!-- tags -->
<g class="tag t1" transform="translate(130,120)"><rect width="150" height="30" rx="6"/><text x="12" y="19"><tspan class="tick">✓</tspan> Capacity rebuilt</text></g>
<g class="tag t2" transform="translate(330,92)"><rect width="176" height="30" rx="6"/><text x="12" y="19"><tspan class="tick">✓</tspan> Pipeline and forecast</text></g>
<g class="tag t3" transform="translate(530,64)"><rect width="170" height="30" rx="6"/><text x="12" y="19"><tspan class="tick">✓</tspan> Retention and long tail</text></g>
<g class="tag t4" transform="translate(700,32)"><rect width="150" height="30" rx="6"/><text x="12" y="19"><tspan class="tick">✓</tspan> Revenue recovered</text></g>
<!-- knot where the lines meet -->
<g class="knot"><circle cx="860" cy="111" r="9" fill="#1F3D2B" stroke="#9CAF88" stroke-width="2"/><circle cx="860" cy="111" r="16" fill="none" stroke="#9CAF88" stroke-width="1" opacity=".6"/></g>
<!-- legend -->
<g transform="translate(60,348)"><line x1="0" y1="-4" x2="26" y2="-4" class="plan"/><text class="legend" x="34" y="0">The plan</text>
<line x1="130" y1="-4" x2="156" y2="-4" stroke="#9CAF88" stroke-width="3" stroke-linecap="round"/><text class="legend" x="164" y="0">What the engine can carry</text>
<rect x="360" y="-12" width="18" height="10" fill="#B03A2E" opacity=".18"/><text class="legend" x="386" y="0">The gap, before each intervention lands</text></g>
</svg>
<figcaption>Plan versus engine: four gaps closed, and kept closed.</figcaption>
</figure>
