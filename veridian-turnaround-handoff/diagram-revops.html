<div class="dg--revops2" style="background:#F5F7F2;border-radius:6px">
<style>.dg--revops2>svg{display:block;width:100%;height:auto}</style>
<svg viewBox="0 0 900 360" role="img" aria-labelledby="dgro2t" xmlns="http://www.w3.org/2000/svg">
<title id="dgro2t">A forecast that wanders around the plan gives way to one that tracks it, as forecasting, deal desk and pipeline governance come on</title>
<defs>
 <linearGradient id="ro2glass" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#E4EBDD" stop-opacity=".9"/></linearGradient>
 <style>
  .ro2ax{stroke:#C9D3C3;stroke-width:1}
  .ro2lbl{font:600 11px Inter,Calibri,sans-serif;fill:#6B7570;letter-spacing:.12em}
  .ro2plan{fill:none;stroke:#1F3D2B;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 10}
  .ro2wander{fill:none;stroke:#B03A2E;stroke-width:2.5;stroke-linecap:round;opacity:.55;animation:ro2gone 10s ease-in infinite}
  .ro2true{fill:none;stroke:#9CAF88;stroke-width:3;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;animation:ro2draw 10s ease-out infinite}
  .ro2tag{animation:ro2pop 10s ease-out infinite}
  .ro2tag rect{fill:url(#ro2glass);stroke:#9CAF88;stroke-width:.8}
  .ro2tag text{font:600 11px Inter,Calibri,sans-serif;fill:#1F3D2B}
  .ro2tag .ro2tick{font:700 11px Inter,sans-serif;fill:#2E7D32}
  .ro2t1{animation-name:ro2pop1}.ro2t2{animation-name:ro2pop2}.ro2t3{animation-name:ro2pop3}
  .ro2knot{animation:ro2knot 10s ease-out infinite}
  .ro2legend{font:500 12px Inter,Calibri,sans-serif;fill:#2B2B2B}
  @keyframes ro2gone{0%,26%{opacity:.55}44%,90%{opacity:0}100%{opacity:.55}}
  @keyframes ro2draw{0%{stroke-dashoffset:900}18%{stroke-dashoffset:900}52%{stroke-dashoffset:0}92%{stroke-dashoffset:0}100%{stroke-dashoffset:900}}
  @keyframes ro2pop1{0%,20%{opacity:0;transform:translateY(6px)}26%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes ro2pop2{0%,28%{opacity:0;transform:translateY(6px)}34%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes ro2pop3{0%,36%{opacity:0;transform:translateY(6px)}42%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes ro2knot{0%,50%{opacity:0;transform:scale(.6);transform-origin:860px 86px}56%,90%{opacity:1;transform:scale(1);transform-origin:860px 86px}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.ro2true{animation:none;stroke-dashoffset:0}.ro2wander{animation:none;opacity:0}.ro2tag,.ro2knot{animation:none;opacity:1}}
 </style>
</defs>
<line class="ro2ax" x1="60" y1="280" x2="860" y2="280"/><line class="ro2ax" x1="60" y1="40" x2="60" y2="280"/>
<text class="ro2lbl" x="60" y="302">WEEK 1</text><text class="ro2lbl" x="460" y="302" text-anchor="middle">THE QUARTER</text><text class="ro2lbl" x="860" y="302" text-anchor="end">WEEK 13</text>
<text class="ro2lbl" x="48" y="46" text-anchor="end">ARR</text>
<path class="ro2plan" d="M60,250 L860,82"/>
<text class="ro2lbl" x="856" y="66" text-anchor="end">PLAN</text>
<path class="ro2wander" d="M60,246 L148,160 L232,252 L324,142 L412,236 L498,120 L586,224 L676,132 L764,200 L860,150"/>
<path class="ro2true" d="M60,252 C200,230 320,200 460,168 S720,110 860,86"/>
<g class="ro2tag ro2t1" transform="translate(150,96)"><rect width="128" height="30" rx="6"/><text x="12" y="19"><tspan class="ro2tick">&#10003;</tspan> Forecasting</text></g>
<g class="ro2tag ro2t2" transform="translate(330,70)"><rect width="118" height="30" rx="6"/><text x="12" y="19"><tspan class="ro2tick">&#10003;</tspan> Deal desk</text></g>
<g class="ro2tag ro2t3" transform="translate(500,44)"><rect width="190" height="30" rx="6"/><text x="12" y="19"><tspan class="ro2tick">&#10003;</tspan> Pipeline governance</text></g>
<g class="ro2knot"><circle cx="860" cy="86" r="9" fill="#1F3D2B" stroke="#9CAF88" stroke-width="2"/><circle cx="860" cy="86" r="16" fill="none" stroke="#9CAF88" stroke-width="1" opacity=".6"/></g>
<g transform="translate(60,348)"><line x1="0" y1="-4" x2="26" y2="-4" stroke="#1F3D2B" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><text class="ro2legend" x="34" y="0">The plan</text>
<line x1="130" y1="-4" x2="156" y2="-4" stroke="#B03A2E" stroke-width="2.5" opacity=".55" stroke-linecap="round"/><text class="ro2legend" x="164" y="0">The forecast, before</text>
<line x1="320" y1="-4" x2="346" y2="-4" stroke="#9CAF88" stroke-width="3" stroke-linecap="round"/><text class="ro2legend" x="354" y="0">The forecast, after</text></g>
</svg>
</div>
