<div class="dg--diligence2" style="background:#F5F7F2;border-radius:6px">
<style>.dg--diligence2>svg{display:block;width:100%;height:auto}</style>
<svg viewBox="0 0 900 360" role="img" aria-labelledby="dgdd2t" xmlns="http://www.w3.org/2000/svg">
<title id="dgdd2t">Management's plan tested against a forecast rebuilt from the company's own CRM, billing and contract data, with the haircut made visible</title>
<defs>
 <linearGradient id="dd2hair" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#B03A2E" stop-opacity=".18"/><stop offset="1" stop-color="#B03A2E" stop-opacity=".05"/></linearGradient>
 <linearGradient id="dd2glass" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#E4EBDD" stop-opacity=".9"/></linearGradient>
 <style>
  .dd2ax{stroke:#C9D3C3;stroke-width:1}
  .dd2lbl{font:600 11px Inter,Calibri,sans-serif;fill:#6B7570;letter-spacing:.12em}
  .dd2plan{fill:none;stroke:#1F3D2B;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 10}
  .dd2hairband{fill:url(#dd2hair);animation:dd2band 10s ease-out infinite}
  .dd2true{fill:none;stroke:#9CAF88;stroke-width:3;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;animation:dd2draw 10s ease-out infinite}
  .dd2tag{animation:dd2pop 10s ease-out infinite}
  .dd2tag rect{fill:url(#dd2glass);stroke:#9CAF88;stroke-width:.8}
  .dd2tag text{font:600 11px Inter,Calibri,sans-serif;fill:#1F3D2B}
  .dd2tag .dd2tick{font:700 11px Inter,sans-serif;fill:#2E7D32}
  .dd2t1{animation-name:dd2pop1}.dd2t2{animation-name:dd2pop2}.dd2t3{animation-name:dd2pop3}
  .dd2verdict{animation:dd2verdict 10s ease-out infinite}
  .dd2verdict rect{fill:#1F3D2B;stroke:#9CAF88;stroke-width:1}
  .dd2verdict text{font:600 11px Inter,Calibri,sans-serif;fill:#F5F7F2;letter-spacing:.08em}
  .dd2legend{font:500 12px Inter,Calibri,sans-serif;fill:#2B2B2B}
  @keyframes dd2draw{0%,14%{stroke-dashoffset:900}48%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:900}}
  @keyframes dd2band{0%,40%{opacity:0}52%,90%{opacity:1}100%{opacity:0}}
  @keyframes dd2pop1{0%,16%{opacity:0;transform:translateY(6px)}22%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes dd2pop2{0%,24%{opacity:0;transform:translateY(6px)}30%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes dd2pop3{0%,32%{opacity:0;transform:translateY(6px)}38%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes dd2verdict{0%,56%{opacity:0;transform:translateY(6px)}64%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.dd2true{animation:none;stroke-dashoffset:0}.dd2hairband{animation:none;opacity:1}.dd2tag,.dd2verdict{animation:none;opacity:1}}
 </style>
</defs>
<line class="dd2ax" x1="60" y1="280" x2="860" y2="280"/><line class="dd2ax" x1="60" y1="40" x2="60" y2="280"/>
<text class="dd2lbl" x="60" y="302">Q1</text><text class="dd2lbl" x="460" y="302" text-anchor="middle">THE NEXT FOUR QUARTERS</text><text class="dd2lbl" x="860" y="302" text-anchor="end">Q4</text>
<text class="dd2lbl" x="48" y="46" text-anchor="end">BOOKINGS</text>
<path class="dd2plan" d="M60,236 L860,70"/>
<text class="dd2lbl" x="856" y="54" text-anchor="end">MANAGEMENT'S PLAN</text>
<path class="dd2hairband" d="M60,236 L860,70 L860,138 L60,244 Z"/>
<path class="dd2true" d="M60,244 C260,232 420,208 580,182 S780,150 860,138"/>
<g class="dd2tag dd2t1" transform="translate(110,96)"><rect width="100" height="30" rx="6"/><text x="12" y="19"><tspan class="dd2tick">&#10003;</tspan> CRM</text></g>
<g class="dd2tag dd2t2" transform="translate(250,70)"><rect width="110" height="30" rx="6"/><text x="12" y="19"><tspan class="dd2tick">&#10003;</tspan> Billing</text></g>
<g class="dd2tag dd2t3" transform="translate(400,44)"><rect width="130" height="30" rx="6"/><text x="12" y="19"><tspan class="dd2tick">&#10003;</tspan> Contracts</text></g>
<g class="dd2verdict" transform="translate(600,190)"><rect width="236" height="34" rx="6"/><text x="118" y="21" text-anchor="middle">SUPPORTED, WITH A HAIRCUT</text></g>
<g transform="translate(60,348)"><line x1="0" y1="-4" x2="26" y2="-4" stroke="#1F3D2B" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><text class="dd2legend" x="34" y="0">The plan as presented</text>
<line x1="200" y1="-4" x2="226" y2="-4" stroke="#9CAF88" stroke-width="3" stroke-linecap="round"/><text class="dd2legend" x="234" y="0">Rebuilt from the data</text>
<rect x="420" y="-12" width="18" height="10" fill="#B03A2E" opacity=".18"/><text class="dd2legend" x="446" y="0">The haircut, made visible before you pay for it</text></g>
</svg>
</div>
